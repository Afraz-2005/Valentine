<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Samantha</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;800&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Passions+Conflict&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Rochester&display=swap');
        :root {
            --red: #ff004d;
            --pink: #ff6b9d;
            --dark: #0a0005;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        /* --- LOADER STYLES --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
        }

        .heartbeat-container {
            width: 300px;
            height: 150px;
            position: relative;
        }

        .ecg-line {
            fill: none;
            stroke: var(--red);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: ecgDraw 2.5s linear infinite, glow 1s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px var(--red));
        }

        @keyframes ecgDraw {
            0% { stroke-dashoffset: 1000; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px var(--red)); }
            to { filter: drop-shadow(0 0 20px var(--pink)); }
        }

        /* --- MAIN CONTENT STYLES --- */
        #main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0; /* Hidden initially */
            pointer-events: none;
            
        }

        /* SVG Text for Brush Effect */
        .brush-text svg {
            width: 90vw;
            height: auto;
            max-width: 800px;
            margin-bottom: 20px;
        }

        .brush-text text {
            font-family: 'Great Vibes', cursive;
            font-size: 80px;
            fill: transparent;
            stroke: #fff;
            stroke-width: 1.5;
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
        }

        .brush-text.animate text {
            animation: brushWrite 4s forwards ease-in-out, fillIn 2s 3s forwards;
        }

        @keyframes brushWrite {
            to { stroke-dashoffset: 0; }
        }

        @keyframes fillIn {
            to { fill: #fff; stroke: transparent; text-shadow: 0 0 20px rgba(255, 105, 180, 0.8); }
        }

        /* --- THE REVEAL TEXTS --- */
        .message-container {
            text-align: center;
            position: relative;
            z-index: 20;
        }

        /* "I Love You" Style */
        #text-ily {
            font-size: 2rem;
            color: #fff;
            font-weight: 300;
            /* letter-spacing: 2px; */
            opacity: 0;
            transform: scale(10); /* Starts Huge */
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* margin-bottom: 40px; */
            /* margin-bottom: 40px; */
            /* font-family: LAvishly Yours, cursive; */
        }

        #text-ily.visible {
            opacity: 1;
            transform: scale(1);
            margin-bottom: 70px;
        }

        /* "Samantha Rahman" Style */
        #text-name {
            font-size: 2.5vw; /* Massive */
            font-weight: 800; /* Thick */
            color: var(--red);
            text-transform: uppercase;
            /* letter-spacing: 2px; */
            opacity: 0;
            transform: translateY(100px); /* Starts from bottom */
            filter: blur(10px);
            transition: all 1s ease-out;
        }

        #text-name.visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
            animation: heartbeatName 1.5s infinite;
            text-shadow: 0 0 30px var(--red), 0 0 60px var(--pink);
            margin-bottom: 150px;
        }

        @keyframes heartbeatName {
            0% { transform: scale(1); }
            15% { transform: scale(1.05); }
            30% { transform: scale(1); }
            45% { transform: scale(1.05); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* --- BACKGROUND FIRE CANVAS --- */
        #fire-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Pulse Overlay */
        .pulse-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255, 0, 80, 0.1) 100%);
            z-index: 5;
            animation: bgPulse 4s infinite;
            pointer-events: none;
        }

        @keyframes bgPulse {
            0% { opacity: 0.2; }
            50% { opacity: 0.5; }
            100% { opacity: 0.2; }
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .brush-text text { font-size: 60px; }
            #text-name { font-size: 6vw; }
            #text-ily { font-size: 5.5vw; }
        }

    </style>
</head>
<body>

    <div id="loader">
        <div class="heartbeat-container">
            <svg viewBox="0 0 500 150">
                <path class="ecg-line" d="M0,75 L100,75 L120,20 L140,130 L160,75 L200,75 L220,10 L240,140 L260,75 L350,75 L370,30 L390,120 L410,75 L500,75" />
            </svg>
        </div>
    </div>

    <canvas id="fire-canvas"></canvas>
    <div class="pulse-overlay"></div>

    <div id="main-content">
        
        <div class="brush-text" id="brushText" >
            <svg viewBox="0 0 700 250">
                <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" >
                    Happy Valentine's Day
                </text>
            </svg>
        </div>

        <div class="message-container">
            <div id="text-ily">I Love You</div>
            <div id="text-name">Samantha Rahman</div>
        </div>

    </div>

    <script>
        // --- TIMING LOGIC ---
        window.onload = function() {
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('main-content');
            const brushText = document.getElementById('brushText');
            const textIly = document.getElementById('text-ily');
            const textName = document.getElementById('text-name');

            // 1. Wait 3 seconds for heartbeat loader
            setTimeout(() => {
                loader.style.opacity = '0';
                
                setTimeout(() => {
                    loader.style.display = 'none';
                    
                    // 2. Show Main Content Area
                    mainContent.style.opacity = '1';
                    
                    // 3. Start "Happy V-day" Brush Write
                    brushText.classList.add('animate');

                    // 4. "I Love You" slams in (3.5s after loader finishes)
                    setTimeout(() => {
                        textIly.classList.add('visible');
                    }, 3500);

                    // 5. "Samantha Rahman" reveals (1 second later -> 4.5s)
                    setTimeout(() => {
                        textName.classList.add('visible');
                        explodeHearts(); // BOOM!
                    }, 4500);

                }, 1000); // Wait for loader fade out
            }, 3000);
        };

        // --- PARTICLE SYSTEM (FIRE & HEARTS) ---
        const canvas = document.getElementById('fire-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#ff004d', '#ff6b9d', '#ff3366', '#ffffff', '#7a0026'];

        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || canvas.height + Math.random() * 100;
                this.size = Math.random() * 5 + 1;
                // Explosion particles move faster and in all directions
                this.speedY = isExplosion ? (Math.random() * 14 - 7) : (Math.random() * 3 + 1);
                this.speedX = isExplosion ? (Math.random() * 14 - 7) : (Math.random() * 2 - 1);
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.decay = isExplosion ? Math.random() * 0.015 + 0.005 : 0.005;
                this.isHeart = Math.random() > 0.6; 
            }

            update() {
                // If standard fire, move up. If explosion, move based on velocity
                if (!this.isExplosion) {
                     this.y -= this.speedY;
                     this.x += this.speedX;
                } else {
                     this.y += this.speedY;
                     this.x += this.speedX;
                }
                
                this.alpha -= this.decay;
                
                // Respawn standard particles, kill explosion particles
                if (this.alpha <= 0 && this.decay <= 0.01) {
                   this.reset();
                }
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.alpha = 1;
                this.speedY = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
            }

            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                
                if (this.isHeart) {
                    ctx.font = `${this.size * 4}px Arial`;
                    ctx.fillText("♥", this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                }
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            // Background fire
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        function explodeHearts() {
            // Massive explosion from center
            for (let i = 0; i < 300; i++) {
                let p = new Particle(canvas.width / 2, canvas.height / 2, true);
                p.decay = 0.01; // Slower fade for explosion
                particles.push(p);
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Remove dead explosion particles
                if (particles[i].alpha <= 0 && particles[i].decay > 0.01) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
